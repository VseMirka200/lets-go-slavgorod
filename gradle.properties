# Общие настройки Gradle. Настройки среды разработки имеют приоритет над этим файлом.
# Параметры JVM демона, включая объём памяти.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Параллельное выполнение задач и кэширование сборки и конфигурации.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Использование библиотек AndroidX и официального стиля Kotlin.
android.useAndroidX=true
kotlin.code.style=official

# Класс R каждой библиотеки содержит только её собственные ресурсы.
android.nonTransitiveRClass=true

# Полный режим R8 и использование демона Gradle.
android.enableR8.fullMode=true
org.gradle.daemon=true

# Инкрементальная компиляция Kotlin и настройки KSP.
kotlin.incremental=true
ksp.useKSP2=true

# Настройки сборки Android.
android.enableJetifier=false
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# Параллельная синхронизация проекта.
org.gradle.tooling.parallel=true
