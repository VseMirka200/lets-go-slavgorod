version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-routine:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Compose 2026.09 requires compileSdk >= 37; lift this restriction after SDK migration.
    ignore:
      - dependency-name: "androidx.compose:compose-bom"
        update-types:
          - "version-update:semver-major"
      # AndroidX Core 1.19 and Navigation 2.10 require compileSdk 37.
      # Remove these constraints when the project migrates from compileSdk 36.
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: [">=2.10.0"]
