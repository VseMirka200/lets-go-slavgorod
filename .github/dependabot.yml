version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-routine:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Compose 2026.09 requires compileSdk >= 37; lift this restriction after SDK migration.
    ignore:
      - dependency-name: "androidx.compose:compose-bom"
        update-types:
          - "version-update:semver-major"
