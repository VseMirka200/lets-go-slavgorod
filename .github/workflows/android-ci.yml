name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - ".github/workflows/android-ci.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  pull_request:
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - ".github/workflows/android-ci.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run static analysis
        run: ./gradlew --no-daemon :app:detekt :app:lintDebug :app:lintRelease

      - name: Compile unit test sources
        run: ./gradlew --no-daemon :app:compileDebugUnitTestKotlin

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
