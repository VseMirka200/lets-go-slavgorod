name: Dependency scope audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency scope audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Inspect release runtime dependency tree
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-dependencies.txt"
          echo "== Dependencies associated with Dependabot alerts in release runtime =="
          grep -Ein 'bouncycastle|bcprov|bcpkix|jdom2|jose4j|guava|commons-lang3|httpclient|kotlin-gradle-plugin' "$RUNNER_TEMP/release-dependencies.txt" || true
          echo "== Release runtime dependency count =="
          wc -l "$RUNNER_TEMP/release-dependencies.txt"

      - name: Inspect Gradle plugin dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict :buildEnvironment :app:buildEnvironment > "$RUNNER_TEMP/build-dependencies.txt"
          echo "== Dependencies associated with Dependabot alerts in Gradle plugins =="
          grep -Ein 'bouncycastle|bcprov|bcpkix|jdom2|jose4j|guava|commons-lang3|httpclient|kotlin-gradle-plugin' "$RUNNER_TEMP/build-dependencies.txt" || true
          echo "== Build environment dependency count =="
          wc -l "$RUNNER_TEMP/build-dependencies.txt"
