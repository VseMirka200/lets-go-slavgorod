name: Dependency scope audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency scope audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Inspect release runtime dependency tree
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-dependencies.txt"
          echo "== Dependencies associated with Dependabot alerts in release runtime =="
          grep -Ein 'bouncycastle|bcprov|bcpkix|jdom2|jose4j|guava|commons-lang3|httpclient|kotlin-gradle-plugin' "$RUNNER_TEMP/release-dependencies.txt" || true
          echo "== Release runtime dependency count =="
          wc -l "$RUNNER_TEMP/release-dependencies.txt"

      - name: Inspect Gradle plugin dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict :buildEnvironment :app:buildEnvironment > "$RUNNER_TEMP/build-dependencies.txt"
          echo "== Dependencies associated with Dependabot alerts in Gradle plugins =="
          grep -Ein 'bouncycastle|bcprov|bcpkix|jdom2|jose4j|guava|commons-lang3|httpclient|kotlin-gradle-plugin' "$RUNNER_TEMP/build-dependencies.txt" || true
          echo "== Build environment dependency count =="
          wc -l "$RUNNER_TEMP/build-dependencies.txt"

      - name: Inspect unit-test Kotlin compiler plugin dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict :app:dependencies --configuration kotlinCompilerPluginClasspathDebugUnitTest > "$RUNNER_TEMP/compiler-dependencies.txt"
          echo "== Kotlin compiler plugin dependencies associated with Dependabot alerts =="
          grep -Ein 'bouncycastle|bcprov|bcpkix|jdom2|jose4j|guava|commons-lang3|httpclient|kotlin-gradle-plugin' "$RUNNER_TEMP/compiler-dependencies.txt" || true

      - name: Verify patched versions and release scope
        shell: bash
        run: |
          python -m unittest discover -s tools -p 'test_gradle_security_baseline.py'
          python tools/check_gradle_security_baseline.py "$RUNNER_TEMP/release-dependencies.txt" "$RUNNER_TEMP/build-dependencies.txt" "$RUNNER_TEMP/compiler-dependencies.txt"
