name: Dependency scope audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency scope audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Inspect release runtime dependency tree
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-dependencies.txt"
          echo "== Dependencies associated with Dependabot alerts in release runtime =="
          grep -Ein 'bouncycastle|bcprov|bcpkix|jdom2|jose4j|guava|commons-lang3|httpclient|kotlin-gradle-plugin' "$RUNNER_TEMP/release-dependencies.txt" || true
          echo "== Release runtime dependency count =="
          wc -l "$RUNNER_TEMP/release-dependencies.txt"

      - name: Inspect Gradle plugin dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict :buildEnvironment :app:buildEnvironment > "$RUNNER_TEMP/build-dependencies.txt"
          echo "== Dependencies associated with Dependabot alerts in Gradle plugins =="
          grep -Ein 'bouncycastle|bcprov|bcpkix|jdom2|jose4j|guava|commons-lang3|httpclient|kotlin-gradle-plugin' "$RUNNER_TEMP/build-dependencies.txt" || true
          echo "== Build environment dependency count =="
          wc -l "$RUNNER_TEMP/build-dependencies.txt"

      - name: Verify patched versions and release scope
        shell: bash
        run: |
          python -m unittest discover -s tools -p 'test_gradle_security_baseline.py'
          python tools/check_gradle_security_baseline.py "$RUNNER_TEMP/release-dependencies.txt" "$RUNNER_TEMP/build-dependencies.txt"

      - name: Generate candidate SHA-256 metadata for review (temporary)
        shell: bash
        run: |
          set -euo pipefail
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/verification-before.xml"
          ./gradlew --no-daemon --write-verification-metadata sha256 testDebugUnitTest lintDebug detekt assembleDebug
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import os
          ns = "{https://schema.gradle.org/dependency-verification}"
          before = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "verification-before.xml").getroot()
          after = ET.parse("gradle/verification-metadata.xml").getroot()
          def artifacts(root):
              output = {}
              for c in root.findall(f"{ns}components/{ns}component"):
                  key = (c.get("group"), c.get("name"), c.get("version"))
                  output[key] = {a.get("name"): a.find(f"{ns}sha256").get("value") for a in c.findall(f"{ns}artifact")}
              return output
          original = artifacts(before)
          latest = artifacts(after)
          for key, updated in sorted(latest.items()):
              for name, sha in sorted(updated.items()):
                  if original.get(key, {}).get(name) != sha:
                      print("VERIFIED_NEW_SHA256", *key, name, sha, flush=True)
          PY
