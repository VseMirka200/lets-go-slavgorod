name: Validate schedule data

on:
  push:
    branches: [main]
  pull_request:
    paths: ["tools/validate-published-schedule.mjs", "tools/validate-published-schedule.test.mjs", ".github/workflows/validate-schedule-data.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate published schedule
        run: >-
          node tools/validate-published-schedule.mjs
          'https://script.google.com/macros/s/AKfycbzus49Rc3LBZPDNcwqGteLHFViRCV9nItnX5PgvSkqSiId3mVxg1tp--7o4Cre2Mv40GA/exec'
