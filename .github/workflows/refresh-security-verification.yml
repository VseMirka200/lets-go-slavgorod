name: Refresh dependency verification (temporary)

on:
  push:
    branches: [security/dependabot-19-alerts-audit]

permissions:
  contents: write

concurrency:
  group: security-verification-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'VseMirka200/lets-go-slavgorod'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out audit branch for verified dependency refresh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Recompute SHA-256 for updated dependency artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --write-verification-metadata sha256 :buildEnvironment :app:buildEnvironment
          ./gradlew --no-daemon --write-verification-metadata sha256 :app:dependencies --configuration releaseRuntimeClasspath
          ./gradlew --no-daemon --write-verification-metadata sha256 testDebugUnitTest lintDebug detekt assembleDebug
          python tools/verify-platform-artifacts.py
          git diff --check
          git add gradle/verification-metadata.xml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update SHA-256 verification metadata for patched Gradle dependencies'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
