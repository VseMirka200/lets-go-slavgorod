name: "💬 Отзыв о приложении"
description: "Ошибка, неточность расписания или предложение улучшения"
title: "[Отзыв]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: "## 👋 Спасибо! Не публикуйте личные данные, пароли и сведения об уязвимостях. 🛡️"
  - type: dropdown
    id: category
    attributes:
      label: "Тип сообщения"
      options:
        - "🐞 Ошибка в приложении"
        - "🗓️ Неточность расписания"
        - "💡 Предложение улучшения"
        - "💬 Другой отзыв"
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: "Что произошло?"
      description: "Укажите маршрут, экран и шаги до результата."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Какой результат ожидался?"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Детали и источник"
      description: "Для расписания укажите день, время, остановку и официальный источник."
  - type: input
    id: device
    attributes:
      label: "Устройство и версия Android"
      placeholder: "Например: Redmi Note 12, Android 14"
